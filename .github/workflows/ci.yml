name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Syntax-check server scripts
        run: |
          node --check server/security.mjs
          node --check broker/server.mjs
          node --check broker/cells.mjs
          node --check broker/lib.mjs
          node --check runtime/server.mjs
          node --check scripts/file-bridge.mjs
          node --check scripts/assemble-vercel.mjs
          node --check scripts/check-bundle.mjs
          node --check scripts/health-check.mjs
          node --check cloud/server.mjs

      - name: UI contract (no deleted shadcn layer)
        run: |
          if grep -rn 'from "cn"' src/; then
            echo "ERROR: import { cn } from '@/lib/utils' — never from the cn package."
            exit 1
          fi
          if grep -rn 'components/ui' src/ index.html; then
            echo "ERROR: references to the deleted shadcn components/ui layer."
            exit 1
          fi

      - name: Production build
        run: npm run build

      - name: Single-deploy assembly + bundle budget
        run: npm run build:vercel && npm run check:bundle

      - name: E2E (landing + gate + shell)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
